services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-admin}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis-cache:
    image: redis:7
    restart: unless-stopped
    command: redis-server --port 13000

  redis-queue:
    image: redis:7
    restart: unless-stopped
    command:
      - sh
      - -c
      - redis-server --port 11000
    volumes:
      - redis-queue-data:/data

  crear-sitio:
    image: ${IMAGE_NAME}:latest
    pull_policy: always
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - |
        if [ ! -d "sites/$$SITE_NAME" ]; then
          echo "Creando nuevo sitio..."
          bench new-site "$$SITE_NAME" \
            --admin-password "$$ADMIN_PASSWORD" \
            --mariadb-root-password "$$DB_ROOT_PASSWORD" \
            --db-host mariadb \
            --mariadb-user-host-login-scope=% \
            --set-default
          bench --site "$$SITE_NAME" install-app midas_app
          echo "Sitio creado e instalado."
        else
          echo "El sitio ya existe. Aplicando migraciones..."
        fi
        bench set-config -g db_host mariadb
        bench set-config -gp db_port 3306
        bench set-config -g redis_cache "redis://redis-cache:13000"
        bench set-config -g redis_queue "redis://redis-queue:11000"
        bench set-config -g redis_socketio "redis://redis-queue:11000"
        bench set-config -gp socketio_port 9000
        bench --site "$$SITE_NAME" set-config developer_mode 0
        bench --site "$$SITE_NAME" migrate
    environment:
      SITE_NAME: ${SITE_NAME:-devops-midasgdp.rdtech.lat}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-admin}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  backend:
    image: ${IMAGE_NAME}:latest
    pull_policy: always
    restart: unless-stopped
    command: bench serve --port 8000
    environment:
      DB_HOST: mariadb
      REDIS_CACHE: redis://redis-cache:13000
      REDIS_QUEUE: redis://redis-queue:11000
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      crear-sitio:
        condition: service_completed_successfully

  worker:
    image: ${IMAGE_NAME}:latest
    pull_policy: always
    restart: unless-stopped
    command: bench worker --queue long,short,default
    environment:
      DB_HOST: mariadb
      REDIS_CACHE: redis://redis-cache:13000
      REDIS_QUEUE: redis://redis-queue:11000
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      crear-sitio:
        condition: service_completed_successfully

  scheduler:
    image: ${IMAGE_NAME}:latest
    pull_policy: always
    restart: unless-stopped
    command: bench schedule
    environment:
      DB_HOST: mariadb
      REDIS_CACHE: redis://redis-cache:13000
      REDIS_QUEUE: redis://redis-queue:11000
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      crear-sitio:
        condition: service_completed_successfully

  socketio:
    image: ${IMAGE_NAME}:latest
    pull_policy: always
    restart: unless-stopped
    command: node /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      DB_HOST: mariadb
      REDIS_CACHE: redis://redis-cache:13000
      REDIS_QUEUE: redis://redis-queue:11000
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      crear-sitio:
        condition: service_completed_successfully

  frontend:
    image: ${IMAGE_NAME}:latest
    pull_policy: always
    restart: unless-stopped
    command: nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      SOCKETIO: socketio:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-devops-midasgdp.rdtech.lat}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      - backend
      - socketio

volumes:
  mariadb-data:
  redis-queue-data:
  sites: